name: Dicticus
options:
  bundleIdPrefix: com.dicticus
  deploymentTarget:
    macOS: "15.0"
  xcodeVersion: "16.0"
  groupSortPosition: none
  createIntermediateGroups: true
  defaultConfig: Debug

# Debug-Recorder is a dev-only configuration that inherits Debug and turns on
# the DEBUG_RECORDER compilation condition. Used by the `Dicticus-Debug-Recorder`
# scheme below; the public `Dicticus` scheme (Release) never sees the flag, so
# the GitHub-released DMG contains zero recorder symbols.
configs:
  Debug: debug
  Release: release
  Debug-Recorder: debug

packages:
  WhisperKit:
    url: https://github.com/argmaxinc/argmax-oss-swift.git
    from: 1.0.0
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts.git
    from: 2.4.0
  LaunchAtLogin:
    url: https://github.com/sindresorhus/LaunchAtLogin-Modern.git
    from: 1.1.0
  llama:
    url: https://github.com/mattt/llama.swift.git
    from: 2.8832.0
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle.git
    from: 2.6.0
  GRDB:
    url: https://github.com/groue/GRDB.swift.git
    from: 7.0.0

targets:
  Dicticus:
    type: application
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - path: Dicticus
      - path: ../Shared
        excludes:
          - "DicticusTests/**"
    resources:
      - path: Dicticus/Assets.xcassets
      - path: ../Shared/Resources
    info:
      path: Dicticus/Info.plist
      properties:
        LSUIElement: true
        NSMicrophoneUsageDescription: "Dicticus needs microphone access to transcribe your speech. Your audio never leaves this device."
        NSAppleEventsUsageDescription: "Dicticus pauses your music while you dictate."
        NSAudioCaptureUsageDescription: "Dicticus briefly measures the audio level of other apps' output while you start dictation, so it can pause playing media. The level is computed on-device and never stored or sent anywhere."
        # 2026-07-24 (quick task 260724-9v8): was a hardcoded literal
        # "com.dicticus.app", which meant the settings.configs.Debug
        # PRODUCT_BUNDLE_IDENTIFIER override below had ZERO effect on the actual
        # built app's bundle id — Xcode only substitutes $(VAR) references found
        # in the source Info.plist, it does not force-overwrite literals. This is
        # the root cause of "the CLI isolation recipe silently stopped applying":
        # the recipe never controlled the real installed Info.plist to begin with.
        CFBundleIdentifier: "$(PRODUCT_BUNDLE_IDENTIFIER)"
        CFBundleVersion: "8"
        CFBundleShortVersionString: "1.0.1"
        SUFeedURL: "https://maksim-101.github.io/dicticus/appcast.xml"
        SUPublicEDKey: "svsiIi/mzzxOO1K9AJ7yAXboJb+U0wDoLCoLM1hEqjc="
        SUEnableAutomaticChecks: YES
    entitlements:
      path: Dicticus/Dicticus.entitlements
      properties:
        com.apple.security.app-sandbox: false
        com.apple.security.automation.apple-events: true
        com.apple.security.device.audio-input: true
        com.apple.security.cs.disable-library-validation: true
        com.apple.security.cs.allow-unsigned-executable-memory: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dicticus.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "6.0"
        MACOSX_DEPLOYMENT_TARGET: "15.0"
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_ENTITLEMENTS: Dicticus/Dicticus.entitlements
        INFOPLIST_FILE: Dicticus/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "Developer ID Application"
        DEVELOPMENT_TEAM: ${DEVELOPER_TEAM_ID}
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        OTHER_LDFLAGS: "-framework llama"
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "DEBUG PERSONAL_LEXICON"
          # 2026-07-24 (quick task 260724-9v8): TCC identity separation. The
          # default "Dicticus" scheme's Test action builds this config (see
          # scheme verification note in DicticusTests target below), and
          # scripts/install-local.sh explicitly treats a plain-Debug build as a
          # stale dev artifact — never the canonical /Applications install (see
          # its Step 5c). So this override never reaches a user-facing install;
          # it only ever affects unsigned xcodebuild-test invocations, giving the
          # test host a distinct bundle id from the real com.dicticus.app so an
          # unsigned test host can never claim (and poison) the real app's TCC
          # grants.
          PRODUCT_BUNDLE_IDENTIFIER: com.dicticus.app.xctest
        Debug-Recorder:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "DEBUG DEBUG_RECORDER PERSONAL_LEXICON"
    dependencies:
      - package: WhisperKit
        product: WhisperKit
      - package: KeyboardShortcuts
        product: KeyboardShortcuts
      - package: LaunchAtLogin
        product: LaunchAtLogin
      - package: llama
        product: LlamaSwift
      - package: Sparkle
        product: Sparkle
      - package: GRDB
        product: GRDB
    scheme:
      testTargets:
        - DicticusTests
      gatherCoverageData: false

  DicticusTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - path: DicticusTests
      - path: ../Shared/DicticusTests
    # NSPrincipalClass (2026-07-24 test-isolation hard fix, quick task 260724-9v8):
    # Xcode instantiates this class before any XCTestCase runs, which lets
    # DicticusTestBootstrap.init() redirect DicticusDefaults.suite to an
    # ephemeral store for the whole test process. See
    # Shared/DicticusTests/DicticusTestBootstrap.swift.
    info:
      path: DicticusTests/Info.plist
      properties:
        NSPrincipalClass: DicticusTests.DicticusTestBootstrap
    settings:
      base:
        SWIFT_VERSION: "6.0"
        MACOSX_DEPLOYMENT_TARGET: "15.0"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: DicticusTests/Info.plist
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "DEBUG PERSONAL_LEXICON"
        Debug-Recorder:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "DEBUG DEBUG_RECORDER PERSONAL_LEXICON"
    dependencies:
      - target: Dicticus
      - package: KeyboardShortcuts
        product: KeyboardShortcuts
      - package: llama
        product: LlamaSwift
      - package: GRDB
        product: GRDB

# Top-level schemes — the per-target `scheme:` shorthand on Dicticus generates
# the default `Dicticus` scheme (Debug→Run, Release→Archive) used by
# scripts/build-dmg.sh. This adds a parallel scheme that runs the
# Debug-Recorder configuration so a developer can enable on-disk cleanup
# tracing locally without touching anything the public release path uses.
schemes:
  Dicticus-Debug-Recorder:
    build:
      targets:
        Dicticus: all
    run:
      config: Debug-Recorder
    test:
      config: Debug-Recorder
      targets:
        - DicticusTests
    profile:
      config: Debug-Recorder
    analyze:
      config: Debug-Recorder
    archive:
      config: Debug-Recorder
